#
# Continuous integration for standalone Ruby gems that do not require Rails.

name: "Lesli CI Gem"

on:
  workflow_call:
    inputs:
      ruby-version:
        description: "Ruby version used to test and build the gem"
        required: false
        type: string
        default: "3.3.5"
    secrets:
      CODECOV_TOKEN:
        description: "Optional token used to upload coverage to Codecov"
        required: false

permissions:
  contents: read

jobs:
  tests:
    name: "Ruby gem tests"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

    steps:
      # Checkout the repository and exact commit that called this workflow.
      - name: "Checkout gem repository"
        uses: actions/checkout@v4

      # Install the selected Ruby version and all dependencies from the lockfile.
      - name: "Install Ruby and gems"
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ inputs.ruby-version }}
          bundler-cache: true

      # Every standalone gem exposes the same Rake test interface.
      - name: "Run gem tests with coverage"
        env:
          COVERAGE: "true"
        run: bundle exec rake test

      # Fail clearly when the expected Cobertura report was not generated.
      - name: "Verify coverage report"
        run: test -f coverage/coverage.xml

      # Verify that the repository can produce its distributable gem package.
      - name: "Build Ruby gem"
        run: bundle exec rake build

      # Preserve coverage for inspection and downstream analysis.
      - name: "Upload coverage artifact"
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ github.event.repository.name }}-${{ inputs.ruby-version }}
          path: coverage/
          if-no-files-found: error

      # Preserve the gem generated by Bundler's build task.
      - name: "Upload Ruby gem artifact"
        uses: actions/upload-artifact@v4
        with:
          name: gem-${{ github.event.repository.name }}-${{ inputs.ruby-version }}
          path: pkg/*.gem
          if-no-files-found: error

      # Upload coverage only when the caller provides its Codecov token.
      - name: "Upload coverage to Codecov"
        if: ${{ env.CODECOV_TOKEN != '' }}
        uses: codecov/codecov-action@v5
        with:
          token: ${{ env.CODECOV_TOKEN }}
          files: ./coverage/coverage.xml
          flags: ruby-gem
          name: ruby-${{ inputs.ruby-version }}
          report_type: coverage
          fail_ci_if_error: true

