# Continuous integration for Lesli engines and gems that implement Rails::Engine.

name: "Lesli CI Engine"

on:
  workflow_call:
    inputs:
      ruby-version:
        description: "Ruby version used by every engine test stage"
        required: false
        type: string
        default: "3.3.5"
      rails-version:
        description: "Rails version used by the generated application test"
        required: false
        type: string
        default: "8.1.4"
      module-directory:
        description: "Host directory for the module: engines or gems"
        required: false
        type: string
        default: "engines"
      security-path:
        description: "Path to the Rails application that Brakeman must scan"
        required: false
        type: string
        default: "."
      run-security:
        description: "Run Rails security checks before starting engine tests"
        required: false
        type: boolean
        default: true
      run-integration:
        description: "Test the engine inside the real LesliBuilder host"
        required: false
        type: boolean
        default: true
      run-integration-new:
        description: "Test the engine inside a newly generated Rails application"
        required: false
        type: boolean
        default: false
      builder-ref:
        description: "LesliBuilder branch, tag, or commit used by integration tests"
        required: false
        type: string
        default: "master"
      lesli-ref:
        description: "Lesli branch, tag, or commit used by integration tests"
        required: false
        type: string
        default: "master"
      actions-ref:
        description: "LesliActions branch, tag, or commit containing host configuration"
        required: false
        type: string
        default: "master"
    secrets:
      CODECOV_TOKEN:
        description: "Optional token used to upload coverage to Codecov"
        required: false

permissions:
  contents: read

jobs:
  security:
    name: "Engine security"
    if: ${{ inputs.run-security }}
    uses: ./.github/workflows/lesli-test-security.yaml
    with:
      ruby-version: ${{ inputs.ruby-version }}
      rails-path: ${{ inputs.security-path }}

  tests:
    name: "Engine tests"
    needs: security
    if: ${{ always() && !failure() && !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

    steps:
      # Checkout the repository and exact commit that called this workflow.
      - name: "Checkout engine repository"
        uses: actions/checkout@v4

      # Install the selected Ruby version and all dependencies from the lockfile.
      - name: "Install Ruby and gems"
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ inputs.ruby-version }}
          bundler-cache: true

      # Every Rails engine and Rails gem exposes the same Rake test interface.
      - name: "Run engine tests with coverage"
        env:
          COVERAGE: "true"
        run: bundle exec rake test

      # Fail clearly when the expected Cobertura report was not generated.
      - name: "Verify coverage report"
        run: test -f coverage/coverage.xml

      # Verify that the repository can produce its distributable gem package.
      - name: "Build engine gem"
        run: bundle exec rake build

      # Preserve coverage for inspection and downstream analysis.
      - name: "Upload coverage artifact"
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ github.event.repository.name }}-${{ inputs.ruby-version }}
          path: coverage/
          if-no-files-found: error

      # Preserve the gem generated by Bundler's build task.
      - name: "Upload engine gem artifact"
        uses: actions/upload-artifact@v4
        with:
          name: gem-${{ github.event.repository.name }}-${{ inputs.ruby-version }}
          path: pkg/*.gem
          if-no-files-found: error

      # Upload coverage only when the caller provides its Codecov token.
      - name: "Upload coverage to Codecov"
        if: ${{ env.CODECOV_TOKEN != '' }}
        uses: codecov/codecov-action@v5
        with:
          token: ${{ env.CODECOV_TOKEN }}
          files: ./coverage/coverage.xml
          flags: rails-engine
          name: ruby-${{ inputs.ruby-version }}
          report_type: coverage
          fail_ci_if_error: true

  integration:
    name: "Host integration"
    needs: tests
    if: ${{ inputs.run-integration }}
    uses: ./.github/workflows/lesli-test-integration.yaml
    with:
      ruby-version: ${{ inputs.ruby-version }}
      module-directory: ${{ inputs.module-directory }}
      builder-ref: ${{ inputs.builder-ref }}
      lesli-ref: ${{ inputs.lesli-ref }}
      actions-ref: ${{ inputs.actions-ref }}

  integration-new:
    name: "New application integration"
    needs:
      - tests
      - integration
    if: ${{ always() && !failure() && !cancelled() && inputs.run-integration-new }}
    uses: ./.github/workflows/lesli-test-integration-new.yaml
    with:
      ruby-version: ${{ inputs.ruby-version }}
      rails-version: ${{ inputs.rails-version }}
      module-directory: ${{ inputs.module-directory }}
      lesli-ref: ${{ inputs.lesli-ref }}
      actions-ref: ${{ inputs.actions-ref }}

