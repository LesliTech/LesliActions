# Reusable security checks for Rails applications and Rails engines.

name: "Lesli Test Security"

on:
  workflow_call:
    inputs:
      ruby-version:
        description: "Ruby version used to install dependencies and run Brakeman"
        required: false
        type: string
        default: "3.3.5"
      rails-path:
        description: "Path to the Rails application that Brakeman must scan"
        required: false
        type: string
        default: "."

permissions:
  contents: read

jobs:
  security:
    name: "Scan Rails security"
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      # Checkout the repository and exact commit that called this workflow.
      - name: "Checkout project repository"
        uses: actions/checkout@v4

      # Install the selected Ruby version and all dependencies from the lockfile.
      - name: "Install Ruby and gems"
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ inputs.ruby-version }}
          bundler-cache: true

      # Stop immediately when Brakeman cannot complete the security scan.
      - name: "Run Brakeman security scan"
        run: bundle exec brakeman --path "${{ inputs.rails-path }}" --color --output /dev/stdout

      # Generate a machine-readable report after the security scan succeeds.
      - name: "Generate Brakeman report"
        run: |
          mkdir -p reports/brakeman
          bundle exec brakeman \
            --path "${{ inputs.rails-path }}" \
            --format sonar \
            --output reports/brakeman/brakeman-sonar.json \
            --no-exit-on-warn

      # Preserve the report for SonarCloud or manual inspection.
      - name: "Upload Brakeman report"
        uses: actions/upload-artifact@v4
        with:
          name: brakeman-${{ github.event.repository.name }}
          path: reports/brakeman/
          if-no-files-found: error

